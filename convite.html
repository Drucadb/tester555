<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite Aurora</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #07060e;
            color: #f0edff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { max-width:500px; padding:2rem 1.5rem; width:100%; }
        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 2.5rem;
            text-align: center;
        }
        .icon { font-size:4rem; margin-bottom:1rem; }
        .title { font-family:'Space Grotesk',sans-serif; font-size:1.8rem; font-weight:700; margin-bottom:0.5rem; }
        .subtitle { color:rgba(255,255,255,0.5); margin-bottom:1.5rem; }
        .code-box {
            background:rgba(108,59,247,0.1);
            border:2px dashed rgba(108,59,247,0.2);
            border-radius:12px;
            padding:1rem;
            font-family:'Space Grotesk',monospace;
            font-size:2rem;
            font-weight:700;
            color:#c084fc;
            letter-spacing:4px;
            margin:1rem 0;
        }
        .btn {
            display:inline-flex; align-items:center; gap:0.5rem;
            padding:0.8rem 2rem; border:none; border-radius:10px;
            font-weight:700; cursor:pointer; transition:all 0.3s ease;
            font-family:'Inter',sans-serif; font-size:0.95rem;
            background:linear-gradient(135deg,#6c3bf7,#9d6aff,#c084fc);
            color:white; box-shadow:0 10px 30px rgba(108,59,247,0.2);
            text-decoration:none;
        }
        .btn:hover { transform:translateY(-3px); box-shadow:0 15px 40px rgba(108,59,247,0.35); }
        .btn-outline {
            background:transparent; color:rgba(255,255,255,0.6);
            border:1.5px solid rgba(255,255,255,0.06);
        }
        .btn-outline:hover { background:rgba(255,255,255,0.05); color:white; }
        .features {
            display:grid; grid-template-columns:1fr 1fr; gap:0.8rem;
            margin:1.5rem 0;
        }
        .feature {
            background:rgba(255,255,255,0.02);
            border:1px solid rgba(255,255,255,0.04);
            border-radius:10px; padding:0.8rem;
            font-size:0.8rem; color:rgba(255,255,255,0.5);
        }
        .feature i { color:#c084fc; display:block; font-size:1.2rem; margin-bottom:0.3rem; }
        .error { color:#ef4444; background:rgba(239,68,68,0.1); border-radius:10px; padding:1rem; margin-bottom:1rem; }
        .success { color:#22c55e; background:rgba(34,197,94,0.1); border-radius:10px; padding:1rem; margin-bottom:1rem; }
        .loading { color:rgba(255,255,255,0.5); }
        .spinner { animation:spin 1s linear infinite; }
        @keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="conviteCard">
            <!-- Loading -->
            <div id="loadingState">
                <div class="icon">⏳</div>
                <h2 class="title">Verificando convite...</h2>
                <p class="subtitle"><i class="fas fa-spinner fa-spin"></i> Aguarde um momento</p>
            </div>

            <!-- Error -->
            <div id="errorState" style="display:none;">
                <div class="icon">🚫</div>
                <h2 class="title">Convite inválido!</h2>
                <div class="error" id="errorMessage">Este convite não é válido ou já expirou.</div>
                <a href="/" class="btn">Voltar para o início</a>
            </div>

            <!-- Success -->
            <div id="successState" style="display:none;">
                <div class="icon">🎉</div>
                <h2 class="title">Convite válido!</h2>
                <p class="subtitle">Você foi convidado para o Aurora Premium</p>
                
                <div class="code-box" id="inviteCode">------</div>
                
                <div class="features">
                    <div class="feature">
                        <i class="fas fa-gift"></i>
                        <span>Ganhe <strong id="rewardUser">3</strong> tentativas extras</span>
                    </div>
                    <div class="feature">
                        <i class="fas fa-star"></i>
                        <span>Quem convidou ganha <strong id="rewardCreator">5</strong> tentativas</span>
                    </div>
                </div>

                <p style="color:rgba(255,255,255,0.3);font-size:0.8rem;margin-bottom:1.5rem;">
                    <i class="fas fa-user"></i> Criado por: <strong id="creatorName">--</strong>
                </p>

                <button class="btn" id="useInviteBtn" onclick="usarConvite()">
                    <i class="fas fa-check"></i> Usar Convite
                </button>
                <br><br>
                <a href="/" class="btn btn-outline">
                    <i class="fas fa-home"></i> Voltar ao início
                </a>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // PÁGINA DE CONVITE
        // ============================================================
        
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        // Elementos
        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const successState = document.getElementById('successState');
        const errorMessage = document.getElementById('errorMessage');
        const inviteCode = document.getElementById('inviteCode');
        const creatorName = document.getElementById('creatorName');
        const rewardUser = document.getElementById('rewardUser');
        const rewardCreator = document.getElementById('rewardCreator');

        // Verificar se tem código
        if (!code) {
            loadingState.style.display = 'none';
            errorState.style.display = 'block';
            errorMessage.textContent = 'Código de convite não fornecido.';
            return;
        }

        // Validar convite
        async function validarConvite() {
            try {
                const response = await fetch(`/api/invites/validate?code=${code}`);
                const data = await response.json();

                loadingState.style.display = 'none';

                if (response.ok && data.valid) {
                    successState.style.display = 'block';
                    inviteCode.textContent = data.invite.code;
                    creatorName.textContent = data.invite.creator;
                    rewardUser.textContent = data.invite.rewards?.user?.recoveryAttempts || 3;
                    rewardCreator.textContent = data.invite.rewards?.creator?.recoveryAttempts || 5;
                    
                    // Salvar código para usar depois
                    window.inviteCode = data.invite.code;
                } else {
                    errorState.style.display = 'block';
                    errorMessage.textContent = data.message || 'Este convite não é válido ou já expirou.';
                }
            } catch (error) {
                loadingState.style.display = 'none';
                errorState.style.display = 'block';
                errorMessage.textContent = 'Erro ao verificar convite. Tente novamente.';
                console.error('Erro:', error);
            }
        }

        // Usar convite
        async function usarConvite() {
            const btn = document.getElementById('useInviteBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Usando...';

            try {
                const token = localStorage.getItem('aurora_token');
                if (!token) {
                    // Redirecionar para login
                    window.location.href = '/?login=true&invite=' + window.inviteCode;
                    return;
                }

                const response = await fetch('/api/invites/use', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ code: window.inviteCode })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('🎉 Convite usado com sucesso!\n\n' + 
                          'Você ganhou tentativas extras!\n' +
                          'O criador do convite também foi recompensado.');
                    window.location.href = '/?convite=usado';
                } else {
                    alert('❌ ' + (data.message || 'Erro ao usar convite'));
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-check"></i> Usar Convite';
                }
            } catch (error) {
                alert('❌ Erro ao usar convite. Tente novamente.');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check"></i> Usar Convite';
                console.error('Erro:', error);
            }
        }

        // Iniciar
        validarConvite();
    </script>
</body>
</html>
